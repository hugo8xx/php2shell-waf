# Minimal ModSecurity v2 base (Debian modsecurity.conf-recommended
# defaults) — deliberately WITHOUT its rules 200000-200004, so only
# local-vps/modsecurity/php2shell.conf decides.
SecRuleEngine On
SecRequestBodyAccess On
SecRequestBodyLimit 13107200
SecRequestBodyNoFilesLimit 131072
SecRequestBodyLimitAction Reject
SecResponseBodyAccess Off
SecTmpDir /tmp/
SecDataDir /tmp/
SecAuditEngine Off
SecDebugLogLevel 0
