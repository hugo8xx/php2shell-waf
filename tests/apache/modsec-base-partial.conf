# Same as modsec-base-reject.conf but with the common tuning
# "ProcessPartial": bodies over the limit are inspected only up to it.
SecRuleEngine On
SecRequestBodyAccess On
SecRequestBodyLimit 13107200
SecRequestBodyNoFilesLimit 131072
SecRequestBodyLimitAction ProcessPartial
SecResponseBodyAccess Off
SecTmpDir /tmp/
SecDataDir /tmp/
SecAuditEngine Off
SecDebugLogLevel 0
