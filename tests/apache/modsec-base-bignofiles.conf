# Common tuning for big forms: NoFilesLimit raised to 13 MB and
# ProcessPartial. Size limits no longer stop the PoC shape, so this
# layer shows whether php2shell.conf catches it on its own.
SecRuleEngine On
SecRequestBodyAccess On
SecRequestBodyLimit 13107200
SecRequestBodyNoFilesLimit 13107200
SecRequestBodyLimitAction ProcessPartial
SecResponseBodyAccess Off
SecTmpDir /tmp/
SecDataDir /tmp/
SecAuditEngine Off
SecDebugLogLevel 0
