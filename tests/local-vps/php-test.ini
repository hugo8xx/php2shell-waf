; Test-only overrides so this container behaves like a stock
; Debian/Ubuntu PHP-FPM install.
;
; The official php Docker image ships fastcgi.logging=Off; distros
; leave the default On, which sends PHP errors to nginx's error log
; ("FastCGI sent in stderr ... client: <ip>") — what fail2ban reads.
fastcgi.logging = On
log_errors = On
; Low limit so oom.php fails fast.
memory_limit = 32M
