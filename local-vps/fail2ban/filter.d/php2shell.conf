# Ban clients whose requests drive PHP into fatal OOM / timeouts
# (the "producer" step of PHP2Shell) — read from the nginx error log,
# where PHP-FPM stderr is logged together with the client IP.
[Definition]
failregex = ^.*FastCGI sent in stderr: "PHP message: PHP Fatal error:\s+(?:Allowed memory size of \d+ bytes exhausted|Out of memory|Maximum execution time of \d+ seconds? exceeded).*client: <HOST>,
ignoreregex =
