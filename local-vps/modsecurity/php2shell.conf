# =====================================================================
# Virtual patch: PHP2Shell — CVE-2026-109618 / CVE-2026-109619
#   GHSA-w8hw-w9fx-j79w  (RCE via OOM corruption)
#   GHSA-6wmf-4rv5-p3rp  (RCE via stale global state)
# Affected: PHP < 8.2.35 / 8.3.36 / 8.4.27 / 8.5.12
#
# Engine: ModSecurity v2.9.6+ / v3.0.8+ (MULTIPART_PART_HEADERS needed)
# Rule ID range: 9261800-9261899 — change if it collides with yours.
#
# NOTE: A WAF only reduces exposure. Upgrading PHP is the only complete
# fix. Deploy with SecRuleEngine DetectionOnly first, review logs, then
# switch to On.
# =====================================================================

# --- Tunables -------------------------------------------------------
# Paths that legitimately accept multipart/form-data (regex on REQUEST_FILENAME).
# TODO: replace with your application's real upload endpoints.
SecAction "id:9261800,phase:1,pass,nolog,t:none,\
  setvar:'tx.php2shell_upload_paths=^/(?:upload|wp-admin/async-upload\.php|wp-admin/media-new\.php)',\
  setvar:'tx.php2shell_max_body=10485760',\
  setvar:'tx.php2shell_max_files=20',\
  setvar:'tx.php2shell_max_part_headers=200',\
  setvar:'tx.php2shell_max_args=500'"

# --- 1. Multipart only on allowlisted upload paths -------------------
# The demonstrated exploit path for both CVEs is a multipart request
# parsed during PHP request startup (before any app code runs).
SecRule REQUEST_HEADERS:Content-Type "@rx (?i)multipart/" \
  "id:9261810,phase:1,deny,status:415,log,t:none,\
  msg:'PHP2Shell: multipart request to non-upload path',\
  tag:'CVE-2026-109618',tag:'CVE-2026-109619',\
  chain"
  SecRule REQUEST_FILENAME "!@rx %{tx.php2shell_upload_paths}" "t:none"

# --- 2. Multipart must declare Content-Length (no chunked) -----------
# OOM vector: multipart with no usable declared length slips past the
# post_max_size pre-check and keeps feeding decoded body data.
SecRule REQUEST_HEADERS:Content-Type "@rx (?i)multipart/" \
  "id:9261811,phase:1,deny,status:411,log,t:none,\
  msg:'PHP2Shell: multipart without Content-Length / chunked',\
  tag:'CVE-2026-109618',\
  chain"
  SecRule &REQUEST_HEADERS:Content-Length "@eq 0" "t:none"

SecRule REQUEST_HEADERS:Content-Type "@rx (?i)multipart/" \
  "id:9261812,phase:1,deny,status:400,log,t:none,\
  msg:'PHP2Shell: chunked multipart request',\
  tag:'CVE-2026-109618',\
  chain"
  SecRule REQUEST_HEADERS:Transfer-Encoding "@rx (?i)chunked" "t:none"

# --- 3. Cap declared body size ---------------------------------------
SecRule REQUEST_HEADERS:Content-Length "@gt %{tx.php2shell_max_body}" \
  "id:9261813,phase:1,deny,status:413,log,t:none,\
  msg:'PHP2Shell: request body too large',\
  tag:'CVE-2026-109618'"

# Non-standard multipart Content-Type. PHP treats e.g.
# "multipart/form-data,boundary=x" as multipart, but ModSecurity doesn't
# parse it — so the body checks below would never see its fields.
SecRule REQUEST_HEADERS:Content-Type "@rx (?i)multipart" \
  "id:9261814,phase:1,deny,status:400,log,t:none,\
  msg:'PHP2Shell: non-standard multipart Content-Type',\
  tag:'CVE-2026-109618',tag:'CVE-2026-109619',\
  chain"
  SecRule REQUEST_HEADERS:Content-Type "!@rx (?i)^multipart/form-data\s*;\s*boundary=" "t:none"

# Any body ModSecurity failed to parse must not reach PHP unchecked
# (don't rely on the base modsecurity.conf having rule 200002).
SecRule REQBODY_ERROR "!@eq 0" \
  "id:9261815,phase:2,deny,status:400,log,t:none,\
  msg:'PHP2Shell: request body could not be parsed',\
  tag:'CVE-2026-109618',tag:'CVE-2026-109619'"

# --- 4. Session upload progress field (consumer for CVE-2026-109619) --
# Default session.upload_progress.name. Almost no app uses this feature.
# If you changed the name in php.ini, add it here.
SecRule ARGS_NAMES|MULTIPART_PART_HEADERS "@rx (?i)PHP_SESSION_UPLOAD_PROGRESS" \
  "id:9261820,phase:2,deny,status:403,log,t:none,\
  msg:'PHP2Shell: session upload progress field in request',\
  tag:'CVE-2026-109619'"

# Same check in the query string / cookies (cheap, phase 1)
SecRule ARGS_GET_NAMES|REQUEST_COOKIES_NAMES "@rx (?i)PHP_SESSION_UPLOAD_PROGRESS" \
  "id:9261821,phase:1,deny,status:403,log,t:none,\
  msg:'PHP2Shell: session upload progress name outside body',\
  tag:'CVE-2026-109619'"

# --- 5. Bound multipart structure (OOM amplification) -----------------
# Malformed multipart must never reach PHP.
SecRule MULTIPART_STRICT_ERROR "!@eq 0" \
  "id:9261830,phase:2,deny,status:400,log,t:none,\
  msg:'PHP2Shell: multipart strict error %{MULTIPART_STRICT_ERROR}',\
  tag:'CVE-2026-109618'"

# 1 = definite; 2 = "possible", set by ModSecurity v3 on normal uploads
SecRule MULTIPART_UNMATCHED_BOUNDARY "@eq 1" \
  "id:9261831,phase:2,deny,status:400,log,t:none,\
  msg:'PHP2Shell: multipart unmatched boundary',\
  tag:'CVE-2026-109618'"

# Unlimited headers per part -> in-PHP representation far larger than wire size
SecRule &MULTIPART_PART_HEADERS "@gt %{tx.php2shell_max_part_headers}" \
  "id:9261832,phase:2,deny,status:400,log,t:none,\
  msg:'PHP2Shell: too many multipart part headers',\
  tag:'CVE-2026-109618'"

# Many (incl. empty) file controls -> metadata arrays bypass max_file_uploads
SecRule &FILES_NAMES "@gt %{tx.php2shell_max_files}" \
  "id:9261833,phase:2,deny,status:400,log,t:none,\
  msg:'PHP2Shell: too many file parts',\
  tag:'CVE-2026-109618'"

# Too many input variables
SecRule &ARGS "@gt %{tx.php2shell_max_args}" \
  "id:9261834,phase:2,deny,status:400,log,t:none,\
  msg:'PHP2Shell: too many input variables',\
  tag:'CVE-2026-109618'"

# Deeply nested names (a[b][c][d]...) multiply allocation per field
SecRule ARGS_NAMES|FILES_NAMES "@rx (?:\[[^\]]*\]){6,}" \
  "id:9261835,phase:2,deny,status:400,log,t:none,\
  msg:'PHP2Shell: deeply nested input name',\
  tag:'CVE-2026-109618'"

# --- 6. Outbound: memory disclosure via PHPSESSID cookie --------------
# Leaked worker memory comes back in an oversized PHPSESSID Set-Cookie.
# A normal session id is <= 128 chars (sid_length max 256 on old PHP).
SecRule RESPONSE_HEADERS:Set-Cookie "@rx (?i)PHPSESSID=[^;]{129,}" \
  "id:9261840,phase:3,deny,status:500,log,t:none,\
  msg:'PHP2Shell: oversized PHPSESSID in response (possible memory leak)',\
  tag:'CVE-2026-109619'"

SecRule RESPONSE_HEADERS:Set-Cookie "@rx (?i)PHPSESSID=[^;]*[^A-Za-z0-9,\-;]" \
  "id:9261841,phase:3,deny,status:500,log,t:none,\
  msg:'PHP2Shell: non-standard chars in PHPSESSID response cookie',\
  tag:'CVE-2026-109619'"
