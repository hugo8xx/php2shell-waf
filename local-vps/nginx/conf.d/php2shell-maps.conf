# =====================================================================
# PHP2Shell virtual patch — CVE-2026-109618 / CVE-2026-109619
# Plain nginx (no ModSecurity / Lua needed).
#
# Install: put this file in /etc/nginx/conf.d/ (http{} context),
#          then `include snippets/php2shell-server.conf;` inside each
#          server{} that proxies to PHP. See README.md.
#
# Upgrading PHP to 8.2.35 / 8.3.36 / 8.4.27 / 8.5.12 is the real fix.
# =====================================================================

# --- Paths that legitimately accept multipart/form-data -------------
# TODO: replace with your application's real upload endpoints.
map $uri $php2shell_upload_path {
    default                              0;
    ~^/upload                            1;
    ~^/wp-admin/async-upload\.php$       1;
    ~^/wp-admin/media-new\.php$          1;
    # ~^/api/v1/files                    1;
}

map $http_content_type $php2shell_multipart {
    default          0;
    ~*^\s*multipart/ 1;
}

# 1) Multipart to a non-upload path.
#    Both CVEs are triggered while PHP parses multipart at request
#    startup — before any application code runs.
# 2) Multipart without Content-Length, or chunked.
#    OOM vector: no declared length skips the post_max_size pre-check.
map "$php2shell_multipart:$php2shell_upload_path:$http_content_length:$http_transfer_encoding" $php2shell_bad_multipart {
    default        0;
    ~^1:0:         1;   # multipart on non-upload path
    ~^1:1::        1;   # multipart with no Content-Length
    ~*^1:.*chunked 1;   # chunked multipart
}

# 2b) Non-standard multipart Content-Type (any path). PHP treats
#     "multipart/form-data,boundary=x" as multipart; WAFs often don't.
map $http_content_type $php2shell_odd_multipart {
    default                                    0;
    "~*^multipart/form-data\s*;\s*boundary="   0;
    ~*multipart                                1;
}

# 3) Session upload progress name (consumer for CVE-2026-109619).
#    Body field names can't be inspected by plain nginx — disable the
#    feature in php.ini instead (session.upload_progress.enabled=0).
map "$args|$http_cookie" $php2shell_upload_progress {
    default                         0;
    ~*PHP_SESSION_UPLOAD_PROGRESS   1;
}

# 4) Outbound detection: leaked worker memory returns in an oversized
#    or malformed PHPSESSID cookie. A normal session id is <= 128 chars
#    of [A-Za-z0-9,-]. nginx can't block on upstream response headers,
#    so this only feeds a dedicated access log (and fail2ban).
map $upstream_cookie_PHPSESSID $php2shell_sid_leak {
    default                 0;
    ""                      0;
    "~^[A-Za-z0-9,-]{1,128}$" 0;
    ~.                      1;
}

log_format php2shell '$remote_addr [$time_local] "$request" $status '
                     'ct="$http_content_type" cl="$http_content_length" '
                     'te="$http_transfer_encoding" sid_len_flag=$php2shell_sid_leak';
