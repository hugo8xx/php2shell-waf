# PHP2Shell — include inside each server{} that talks to PHP.
# Requires conf.d/php2shell-maps.conf in http{}.

# Cap body size (keep <= post_max_size in php.ini).
client_max_body_size 10m;

# Buffer the whole body in nginx before PHP sees it, so PHP always
# gets a real CONTENT_LENGTH (default is already "on" — keep it).
fastcgi_request_buffering on;

if ($php2shell_bad_multipart) {
    return 415;
}
if ($php2shell_upload_progress) {
    return 403;
}

# Audit: per-request INI overrides are a CVE-2026-109619 consumer.
#   grep -rn 'PHP_VALUE\|PHP_ADMIN_VALUE' /etc/nginx
# Move any such fastcgi_param into php.ini / the FPM pool instead.

# Flag responses that look like memory disclosure.
access_log /var/log/nginx/php2shell.log php2shell if=$php2shell_sid_leak;
