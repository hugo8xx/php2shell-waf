# =====================================================================
# PHP2Shell virtual patch — CVE-2026-109618 / CVE-2026-109619
# Apache 2.4 (mod_rewrite + core), no ModSecurity needed.
#
# mod_php is the confirmed exploit path: PHP parses the multipart body
# at request startup, before any application code runs.
#
# Install: Include this file INSIDE each <VirtualHost> that serves PHP
# (server-level RewriteRules are not inherited by vhosts), e.g.
#   Include /etc/apache2/php2shell.conf
# then: apachectl configtest && systemctl reload apache2
#
# Upgrading PHP to 8.2.35 / 8.3.36 / 8.4.27 / 8.5.12 is the real fix.
# =====================================================================

# Cap body size (keep <= post_max_size in php.ini).
LimitRequestBody 10485760

<IfModule mod_php.c>
    # Same effect as php.ini; admin flags can't be overridden by .htaccess.
    php_admin_flag session.upload_progress.enabled off
</IfModule>

<IfModule mod_rewrite.c>
    RewriteEngine On

    # 1) Multipart only on upload endpoints.
    #    TODO: replace with your application's real upload endpoints.
    RewriteCond %{HTTP:Content-Type} multipart [NC]
    RewriteCond %{REQUEST_URI} !^/(upload|wp-admin/async-upload\.php|wp-admin/media-new\.php)
    RewriteRule ^ - [R=415,L]

    # 2) Non-standard multipart Content-Type. PHP treats
    #    "multipart/form-data,boundary=x" as multipart; WAFs often don't.
    RewriteCond %{HTTP:Content-Type} multipart [NC]
    RewriteCond %{HTTP:Content-Type} !^multipart/form-data\s*;\s*boundary= [NC]
    RewriteRule ^ - [R=400,L]

    # 3) Multipart must declare Content-Length (no chunked).
    RewriteCond %{HTTP:Content-Type} multipart [NC]
    RewriteCond %{HTTP:Transfer-Encoding} chunked [NC,OR]
    RewriteCond %{HTTP:Content-Length} ^$
    RewriteRule ^ - [R=411,L]

    # 4) Session upload progress name outside the body.
    #    (Body field names need ModSecurity — see ../modsecurity.)
    RewriteCond %{QUERY_STRING} PHP_SESSION_UPLOAD_PROGRESS [NC,OR]
    RewriteCond %{HTTP:Cookie} PHP_SESSION_UPLOAD_PROGRESS [NC]
    RewriteRule ^ - [F,L]
</IfModule>
