; =====================================================================
; PHP2Shell hardening — CVE-2026-109618 / CVE-2026-109619
; Install (Debian/Ubuntu, PHP-FPM 8.x):
;   cp 99-php2shell.ini /etc/php/8.X/fpm/conf.d/
;   systemctl restart php8.X-fpm     ; must restart ALL workers
; Check that no pool file, .user.ini or ini_set() overrides these.
; =====================================================================

; Removes the confirmed upload-progress consumer (CVE-2026-109619).
; Enabled by default and needs no session_start() — turn it off.
session.upload_progress.enabled = 0

; PHP 8.5 only: removes the confirmed mod_php RCE producer.
; (Unknown directive on 8.2–8.4 — delete this line there.)
fatal_error_backtraces = 0

; Shrink the OOM attack surface (CVE-2026-109618).
post_max_size = 10M
upload_max_filesize = 8M
max_file_uploads = 20
max_input_vars = 1000
max_input_nesting_level = 8

; Keep errors in the log, never in the response.
display_errors = Off
log_errors = On
error_reporting = E_ALL

; Optional, strongest config-only workaround for CVE-2026-109618
; (advisory: incomplete, and removes the per-request memory cap —
; pair it with a cgroup/systemd MemoryMax on the FPM service):
; memory_limit = -1
