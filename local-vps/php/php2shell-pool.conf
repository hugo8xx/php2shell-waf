; PHP-FPM pool additions for PHP2Shell (merge into your [www] pool).
; CVE-2026-109619 needs the attacker's "producer" and "consumer"
; requests to hit the SAME worker. Recycling workers often shrinks
; that window; max_requests = 1 closes it at a CPU cost.
[www]
pm.max_requests = 50
; pm.max_requests = 1        ; strongest, if your traffic allows

; Enforce the ini hardening at pool level so apps can't override it.
php_admin_value[session.upload_progress.enabled] = 0
php_admin_value[post_max_size] = 10M
php_admin_value[max_input_vars] = 1000
php_admin_value[max_input_nesting_level] = 8
